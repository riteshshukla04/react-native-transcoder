name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'packages/react-native-transcoder/**'
      - 'example/ios/**'
      - 'scripts/build-ffmpeg-ios.sh'
      - '**/bun.lock'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'packages/react-native-transcoder/**'
      - 'example/ios/**'
      - 'scripts/build-ffmpeg-ios.sh'
      - '**/bun.lock'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (simulator + device)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: example
          bundler-cache: true
      - run: bun install

      - name: Restore FFmpeg XCFrameworks
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: packages/react-native-transcoder/dependencies/prebuilt/ios
          key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}

      - name: Install FFmpeg build tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Cross-build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-ios.sh

      - name: Verify every slice is present
        run: |
          set -euo pipefail
          for LIB in avutil swresample avcodec avformat; do
            FW=packages/react-native-transcoder/dependencies/prebuilt/ios/$LIB.xcframework
            lipo -info "$FW/ios-arm64/$LIB.framework/$LIB"
            lipo -info "$FW/ios-arm64_x86_64-simulator/$LIB.framework/$LIB" | grep -q x86_64
            lipo -info "$FW/ios-arm64_x86_64-simulator/$LIB.framework/$LIB" | grep -q arm64
          done

      - name: Install pods
        working-directory: example/ios
        run: bundle exec pod install

      - name: Build for the simulator
        working-directory: example/ios
        run: |
          xcodebuild -workspace TranscoderExample.xcworkspace \
            -scheme TranscoderExample \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Build for a device (arm64, release)
        working-directory: example/ios
        run: |
          xcodebuild -workspace TranscoderExample.xcworkspace \
            -scheme TranscoderExample \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify the privacy manifest ships in the pod
        run: test -f packages/react-native-transcoder/ios/PrivacyInfo.xcprivacy
