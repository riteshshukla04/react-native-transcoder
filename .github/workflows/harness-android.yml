name: Harness Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/react-native-transcoder/**'
      - 'example/**'
      - '**/bun.lock'
      - '.github/workflows/harness-android.yml'
  pull_request:
    paths:
      - 'packages/react-native-transcoder/**'
      - 'example/**'
      - '**/bun.lock'
      - '.github/workflows/harness-android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  DEVICE_API_LEVEL: '35'
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: pixel_6
  AVD_NAME: Pixel_8_API_35

jobs:
  harness:
    name: On-device Harness suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - run: bun install

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: packages/react-native-transcoder/dependencies/prebuilt/android
          key: ffmpeg-android-x86_64-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-ffmpeg-android.sh', 'scripts/build-codec-libs.sh') }}

      - name: Cross-build FFmpeg when the cache is missing or partial
        run: |
          set -euo pipefail
          if [ -f "packages/react-native-transcoder/dependencies/prebuilt/android/x86_64/lib/libavcodec.so" ]; then
            echo "x86_64 restored from cache"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y nasm
          ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }} ABIS=x86_64 ./scripts/build-ffmpeg-android.sh

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Android app
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=x86_64

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.DEVICE_API_LEVEL }}-${{ env.DEVICE_ARCH }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.DEVICE_API_LEVEL }}
          arch: ${{ env.DEVICE_ARCH }}
          profile: ${{ env.DEVICE_PROFILE }}
          disk-size: 2G
          heap-size: 1G
          force-avd-creation: false
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run Harness tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: example
          api-level: ${{ env.DEVICE_API_LEVEL }}
          arch: ${{ env.DEVICE_ARCH }}
          force-avd-creation: false
          avd-name: ${{ env.AVD_NAME }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "./android/app/build/outputs/apk/debug/app-debug.apk"
            bun run test:harness --harnessRunner android

      - name: Stop Gradle Daemon
        working-directory: example/android
        run: ./gradlew --stop
